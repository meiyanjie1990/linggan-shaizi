<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5EDE0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>家庭灵感骰子</title>
<style>
/* ====== Reset & Base ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FBF7F2;
  --card:#FFFDF8;
  --ink:#3D3226;
  --ink-light:#8B7D6E;
  --ink-faint:#BFB5A8;
  --accent-qianling:#E8927C;
  --accent-lover:#C4929E;
  --accent-verse:#C4A86C;
  --accent-qianling-bg:#FDF3EF;
  --accent-lover-bg:#FDF3F7;
  --accent-verse-bg:#FDF9EF;
  --btn:#C8927A;
  --btn-active:#B07868;
  --hairline:rgba(61,50,38,.08);
  --shadow-card:0 1px 4px rgba(61,50,38,.04),0 4px 16px rgba(61,50,38,.05);
  --shadow-btn:0 2px 12px rgba(180,120,100,.25);
  --radius:16px;
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-text:"STSong","Songti SC","Noto Serif SC","PingFang SC",serif;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1E1B18;
    --card:#282420;
    --ink:#E0D8CD;
    --ink-light:#9B9080;
    --ink-faint:#5C5348;
    --accent-qianling-bg:#2D1F1B;
    --accent-lover-bg:#2B1F24;
    --accent-verse-bg:#2B2519;
    --hairline:rgba(224,216,205,.06);
    --shadow-card:0 1px 4px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.2);
    --shadow-btn:0 2px 14px rgba(160,100,80,.2);
  }
}
html{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);
  background:var(--paper);
  color:var(--ink);
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overflow:hidden;
}
/* subtle paper grain */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
@media (prefers-color-scheme:dark){body::before{opacity:.04}}

.app{
  width:100%;max-width:420px;height:100%;
  display:flex;flex-direction:column;
  padding:24px 18px 0;
  position:relative;z-index:1;
}

/* ====== Header ====== */
.header{text-align:center;padding:8px 0 4px;flex-shrink:0}
.header h1{
  font-size:1.35rem;font-weight:400;letter-spacing:.06em;
  color:var(--ink);font-family:var(--font-text);
}
.header .ornament{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:6px 0 2px;
}
.header .ornament::before,.header .ornament::after{
  content:'';width:28px;height:1px;background:var(--ink-faint);
}
.header .ornament span{font-size:.7rem;color:var(--ink-faint)}
.header .date{
  font-size:.75rem;color:var(--ink-light);margin-top:2px;
  font-family:var(--font-text);letter-spacing:.04em;
}

/* ====== Cards ====== */
.cards{
  flex:1;display:flex;flex-direction:column;gap:12px;
  justify-content:center;padding:8px 0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:18px 16px 18px 18px;
  box-shadow:var(--shadow-card);
  position:relative;display:flex;align-items:flex-start;
  border-left:4px solid transparent;
  transition:transform .3s ease,border-color .3s ease;
  min-height:78px;
}
.card.qianling{border-left-color:var(--accent-qianling)}
.card.lover{border-left-color:var(--accent-lover)}
.card.verse{border-left-color:var(--accent-verse)}

.card.rolling{animation:cardPulse .7s ease}
@keyframes cardPulse{0%{transform:scale(1)}20%{transform:scale(.98)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.card.settled{animation:cardSettle .35s ease}
@keyframes cardSettle{0%{transform:scale(1.01)}50%{transform:scale(.99)}100%{transform:scale(1)}}

.card-icon{
  font-size:1.6rem;margin-right:12px;flex-shrink:0;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.card.qianling .card-icon{background:var(--accent-qianling-bg)}
.card.lover .card-icon{background:var(--accent-lover-bg)}
.card.verse .card-icon{background:var(--accent-verse-bg)}

.card-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card-label{
  font-size:.7rem;color:var(--ink-light);letter-spacing:.06em;
  font-family:var(--font-ui);text-transform:uppercase;
}
.card-text{
  font-size:.95rem;line-height:1.65;font-family:var(--font-text);
  word-break:break-word;min-height:2.4em;display:flex;align-items:center;
}
.card.verse .card-text{font-style:italic}

.card-lock{
  position:absolute;top:10px;right:10px;
  width:28px;height:28px;border:none;background:transparent;
  font-size:.85rem;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  opacity:.25;transition:opacity .2s,transform .2s;z-index:2;
  color:var(--ink);
}
.card-lock:active{transform:scale(.85)}
.card-lock.locked{opacity:.7}

/* ====== Roll Button ====== */
.roll-area{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:14px 0 calc(14px + var(--safe-bottom));
}
.roll-btn{
  height:52px;padding:0 40px;border-radius:26px;
  border:1.5px solid var(--btn);
  background:var(--card);color:var(--btn);
  font-size:1.1rem;cursor:pointer;font-family:var(--font-text);
  letter-spacing:.04em;box-shadow:var(--shadow-btn);
  transition:all .15s;display:flex;align-items:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.roll-btn:active{background:var(--btn);color:#fff;transform:scale(.96)}
.roll-btn:disabled{opacity:.4;cursor:not-allowed}
.roll-btn .dice{font-size:1.4rem}
.roll-hint{
  font-size:.7rem;color:var(--ink-faint);margin-top:8px;
  display:flex;align-items:center;gap:4px;font-family:var(--font-text);
}

/* ====== Bottom Nav ====== */
.bottom-nav{
  position:fixed;bottom:calc(12px + var(--safe-bottom));right:14px;
  display:flex;gap:6px;z-index:10;
}
.nav-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--hairline);
  background:var(--card);box-shadow:var(--shadow-card);
  font-size:1rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--ink-light);
  transition:all .15s;
}
.nav-btn:active{background:var(--paper);transform:scale(.9)}

/* ====== Panel ====== */
.panel-overlay{
  position:fixed;inset:0;background:rgba(30,27,24,.35);z-index:100;
  display:flex;align-items:flex-end;animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{
  background:var(--card);width:100%;max-width:420px;
  max-height:78vh;border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;animation:slideUp .3s ease;
  padding-bottom:var(--safe-bottom);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 10px;
}
.panel-header h3{font-size:1rem;font-weight:500;font-family:var(--font-text)}
.panel-close{
  width:30px;height:30px;border:1px solid var(--hairline);background:transparent;
  border-radius:50%;font-size:1rem;cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:var(--ink-light);
}

.edit-tabs{display:flex;padding:0 16px;gap:4px;margin-bottom:8px}
.edit-tab{
  padding:7px 14px;border:1px solid var(--hairline);border-radius:16px;
  background:transparent;font-size:.8rem;cursor:pointer;
  color:var(--ink-light);font-family:var(--font-ui);
  transition:all .2s;
}
.edit-tab.active{background:var(--ink);color:var(--card);border-color:var(--ink)}

.edit-list{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.edit-item{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--hairline);
  font-size:.85rem;line-height:1.5;font-family:var(--font-text);
}
.edit-item span{flex:1;word-break:break-word}
.edit-item-del{
  width:26px;height:26px;border:none;background:transparent;
  font-size:1rem;cursor:pointer;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--ink-faint);
  flex-shrink:0;transition:color .2s;
}
.edit-item-del:active{color:#c0392b}

.edit-add{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--hairline)}
.edit-add input{
  flex:1;padding:9px 14px;border:1px solid var(--hairline);border-radius:18px;
  font-size:.85rem;font-family:var(--font-text);background:var(--paper);
  color:var(--ink);outline:none;
}
.edit-add input:focus{border-color:var(--ink-light)}
.edit-add button{
  padding:9px 18px;border:none;border-radius:18px;
  background:var(--ink);color:var(--card);font-size:.85rem;
  cursor:pointer;font-family:var(--font-ui);white-space:nowrap;
}

.history-list{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.history-group{margin-bottom:14px}
.history-date{font-size:.75rem;color:var(--ink-light);margin-bottom:6px;padding-left:4px}
.history-roll{
  background:var(--paper);border-radius:12px;padding:10px 14px;
  margin-bottom:6px;font-size:.8rem;line-height:1.55;font-family:var(--font-text);
}
.history-roll .hi{display:flex;gap:6px;align-items:flex-start}
.history-roll .hi+.hi{margin-top:3px}
.history-roll .hi-icon{flex-shrink:0}

.empty-state{text-align:center;color:var(--ink-faint);padding:36px 20px;font-size:.85rem;font-family:var(--font-text)}

.toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--card);padding:8px 20px;
  border-radius:16px;font-size:.8rem;z-index:200;pointer-events:none;
  font-family:var(--font-text);
  animation:toastIn .25s ease,toastOut .25s ease 1.5s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

.install-banner{
  position:fixed;bottom:72px;left:14px;right:14px;
  background:var(--card);border-radius:14px;padding:12px 16px;
  box-shadow:0 4px 24px rgba(0,0,0,.12);z-index:50;
  display:flex;align-items:center;gap:10px;animation:slideUp .35s ease;
  border:1px solid var(--hairline);
}
.install-banner span{flex:1;font-size:.8rem;line-height:1.4;font-family:var(--font-text)}
.install-banner button{
  padding:7px 16px;border:none;border-radius:14px;
  background:var(--ink);color:var(--card);font-size:.8rem;
  cursor:pointer;font-family:var(--font-ui);white-space:nowrap;
}
.install-banner .install-close{
  background:transparent;color:var(--ink-light);font-size:1rem;padding:4px 6px
}

@media (prefers-reduced-motion:reduce){
  .card.rolling,.card.settled{animation:none}
  .panel{animation:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>家庭灵感骰子</h1>
    <div class="ornament"><span>✦</span></div>
    <div class="date" id="dateDisplay"></div>
  </header>

  <div class="cards">
    <div class="card qianling" id="cardQianling">
      <div class="card-icon">👧</div>
      <div class="card-body">
        <div class="card-label">和谦灵玩</div>
        <div class="card-text" id="contentQianling"></div>
      </div>
      <button class="card-lock" id="lockQianling" aria-label="锁定">🔒</button>
    </div>
    <div class="card lover" id="cardLover">
      <div class="card-icon">💑</div>
      <div class="card-body">
        <div class="card-label">为爱人做</div>
        <div class="card-text" id="contentLover"></div>
      </div>
      <button class="card-lock" id="lockLover" aria-label="锁定">🔒</button>
    </div>
    <div class="card verse" id="cardVerse">
      <div class="card-icon">🙏</div>
      <div class="card-body">
        <div class="card-label">今日经文</div>
        <div class="card-text" id="contentVerse"></div>
      </div>
      <button class="card-lock" id="lockVerse" aria-label="锁定">🔒</button>
    </div>
  </div>

  <div class="roll-area">
    <button class="roll-btn" id="rollBtn" aria-label="摇一摇">
      <span class="dice">🎲</span> 摇一摇
    </button>
    <div class="roll-hint">📳 摇晃手机也能触发</div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" id="editBtn" aria-label="编辑">✏️</button>
  <button class="nav-btn" id="historyBtn" aria-label="历史">📋</button>
</div>

<script>

//  内容池 — 每类 100+ 条
// ==================================================================

// ==================== 状态 ====================
const STORAGE_KEY = 'linggan-shaizi-v2';
const HISTORY_KEY = 'linggan-shaizi-history-v2';

function loadData(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return {pools:null,locked:{},todayRoll:null}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){}}
function loadHistory(){try{const r=localStorage.getItem(HISTORY_KEY);if(r)return JSON.parse(r);}catch(e){}return[]}
function saveHistory(r){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(r));}catch(e){}}

let data=loadData();
let pools=data.pools?{...DEFAULT_POOLS,...data.pools}:{...DEFAULT_POOLS};
let locked=data.locked||{qianling:false,lover:false,verse:false};
let history=loadHistory();
let isRolling=false;
let currentResults={qianling:'',lover:'',verse:''};

// ==================== DOM ====================
const $q=document.getElementById('contentQianling');
const $l=document.getElementById('contentLover');
const $v=document.getElementById('contentVerse');
const $cQ=document.getElementById('cardQianling');
const $cL=document.getElementById('cardLover');
const $cV=document.getElementById('cardVerse');
const $lQ=document.getElementById('lockQianling');
const $lL=document.getElementById('lockLover');
const $lV=document.getElementById('lockVerse');
const $btn=document.getElementById('rollBtn');
const $date=document.getElementById('dateDisplay');

// ==================== 工具 ====================
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ==================== 日期 ====================
(function updateDate(){
  const n=new Date();
  const ws=['周日','周一','周二','周三','周四','周五','周六'];
  $date.textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日　${ws[n.getDay()]}`;
})();

// ==================== 锁定 ====================
function updateLockUI(){
  $lQ.className='card-lock'+(locked.qianling?' locked':'');
  $lL.className='card-lock'+(locked.lover?' locked':'');
  $lV.className='card-lock'+(locked.verse?' locked':'');
}
updateLockUI();
function toggleLock(cat){locked[cat]=!locked[cat];updateLockUI();data.locked=locked;saveData(data)}
$lQ.addEventListener('click',e=>{e.stopPropagation();toggleLock('qianling')});
$lL.addEventListener('click',e=>{e.stopPropagation();toggleLock('lover')});
$lV.addEventListener('click',e=>{e.stopPropagation();toggleLock('verse')});

// ==================== 动画 ====================
function animateCard($el,finalText,pool,dur=700){
  return new Promise(resolve=>{
    const steps=12;let step=0;
    function next(){
      if(step>=steps){$el.textContent=finalText;resolve();return}
      let t;do{t=rand(pool)}while(t===$el.textContent&&pool.length>1);
      $el.textContent=t;step++;
      const delay=25+Math.pow(step/steps,3)*180;
      setTimeout(next,delay);
    }
    next();
  });
}

// ==================== 摇 ====================
async function roll(){
  if(isRolling)return;isRolling=true;$btn.disabled=true;

  if(!locked.qianling)currentResults.qianling=rand(pools.qianling);
  if(!locked.lover)currentResults.lover=rand(pools.lover);
  if(!locked.verse)currentResults.verse=rand(pools.verse);

  const anims=[];
  if(!locked.qianling){$cQ.classList.add('rolling');anims.push(animateCard($q,currentResults.qianling,pools.qianling))}
  if(!locked.lover){$cL.classList.add('rolling');anims.push(animateCard($l,currentResults.lover,pools.lover))}
  if(!locked.verse){$cV.classList.add('rolling');anims.push(animateCard($v,currentResults.verse,pools.verse))}
  await Promise.all(anims);

  $cQ.classList.remove('rolling');$cL.classList.remove('rolling');$cV.classList.remove('rolling');
  $cQ.classList.add('settled');$cL.classList.add('settled');$cV.classList.add('settled');
  setTimeout(()=>{$cQ.classList.remove('settled');$cL.classList.remove('settled');$cV.classList.remove('settled')},350);

  playDing();

  const today=todayKey();
  history.unshift({date:today,time:new Date().toISOString(),results:{...currentResults}});
  if(history.length>200)history.length=200;
  saveHistory(history);
  data.todayRoll=today;saveData(data);

  isRolling=false;$btn.disabled=false;
}

// ==================== 叮 ====================
function playDing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const t=ctx.currentTime;
    [0,.1].forEach((o,i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=i===0?784:1047;
      gain.gain.setValueAtTime(.12,t+o);
      gain.gain.exponentialRampToValueAtTime(.001,t+o+.25);
      osc.start(t+o);osc.stop(t+o+.25);
    });
  }catch(e){}
}

// ==================== 摇一摇 ====================
let shakeEnabled=false,lastShake=0;
function requestShake(){
  if(typeof DeviceMotionEvent!=='undefined'){
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(s=>{if(s==='granted'){shakeEnabled=true;toast('✅ 摇一摇已就绪')}}).catch(()=>{});
    }else{shakeEnabled=true}
  }
}
function initShake(){
  let lx,ly,lz;
  window.addEventListener('devicemotion',e=>{
    if(!shakeEnabled||isRolling)return;
    const {x,y,z}=e.accelerationIncludingGravity||{};
    if(lx===undefined){lx=x;ly=y;lz=z;return}
    const d=Math.abs(x-lx)+Math.abs(y-ly)+Math.abs(z-lz);
    if(d>15){const n=Date.now();if(n-lastShake>1500){lastShake=n;roll()}}
    lx=x;ly=y;lz=z;
  });
}

// ==================== 编辑面板 ====================
let panel=null,cat='qianling';
function openPanel(type){
  if(panel)return;
  const ov=document.createElement('div');ov.className='panel-overlay';
  const isEdit=type==='edit';
  ov.innerHTML=isEdit?`
    <div class="panel"><div class="panel-header"><h3>编辑内容</h3><button class="panel-close" id="pc">✕</button></div>
    <div class="edit-tabs">
      <button class="edit-tab active" data-c="qianling">👧 谦灵</button>
      <button class="edit-tab" data-c="lover">💑 爱人</button>
      <button class="edit-tab" data-c="verse">🙏 经文</button>
    </div>
    <div class="edit-list" id="el"></div>
    <div class="edit-add"><input id="ei" placeholder="添加新内容..."><button id="ea">添加</button></div></div>
  `:`
    <div class="panel"><div class="panel-header"><h3>历史记录</h3><button class="panel-close" id="pc">✕</button></div>
    <div class="history-list" id="hl"></div></div>
  `;
  document.body.appendChild(ov);panel={ov,type};
  if(isEdit){renderEdit();bindEdit(ov)}else{renderHistory();bindHistory(ov)}
  ov.addEventListener('click',e=>{if(e.target===ov)closePanel()});
  ov.querySelector('#pc').addEventListener('click',closePanel);
}
function closePanel(){if(!panel)return;panel.ov.remove();panel=null}

function renderEdit(){
  const el=document.getElementById('el');if(!el)return;
  const items=pools[cat];
  el.innerHTML=items.length?items.map((s,i)=>`<div class="edit-item"><span>${esc(s)}</span><button class="edit-item-del" data-i="${i}">✕</button></div>`).join(''):'<div class="empty-state">还没有内容，在下方添加 ✨</div>';
  el.querySelectorAll('.edit-item-del').forEach(b=>b.addEventListener('click',()=>{
    const i=parseInt(b.dataset.i);pools[cat].splice(i,1);savePools();renderEdit();
  }));
}
function bindEdit(ov){
  ov.querySelectorAll('.edit-tab').forEach(t=>t.addEventListener('click',()=>{
    cat=t.dataset.c;ov.querySelectorAll('.edit-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderEdit();
  }));
  ov.querySelector('#ea').addEventListener('click',addItem);
  ov.querySelector('#ei').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
}
function addItem(){
  const inp=document.getElementById('ei');if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  pools[cat].push(v);savePools();renderEdit();inp.value='';inp.focus();
}
function savePools(){
  data.pools={};
  for(const c of ['qianling','lover','verse']){if(JSON.stringify(pools[c])!==JSON.stringify(DEFAULT_POOLS[c]))data.pools[c]=pools[c]}
  saveData(data);
}
function renderHistory(){
  const el=document.getElementById('hl');if(!el)return;
  if(!history.length){el.innerHTML='<div class="empty-state">还没有摇过 🎲</div>';return}
  const grps={};history.forEach(h=>{if(!grps[h.date])grps[h.date]=[];grps[h.date].push(h)});
  el.innerHTML=Object.entries(grps).map(([d,rs])=>`<div class="history-group"><div class="history-date">${fmtDate(d)}</div>${rs.map(r=>`<div class="history-roll"><div class="hi"><span class="hi-icon">👧</span><span>${esc(r.results.qianling)}</span></div><div class="hi"><span class="hi-icon">💑</span><span>${esc(r.results.lover)}</span></div><div class="hi"><span class="hi-icon">🙏</span><span>${esc(r.results.verse)}</span></div></div>`).join('')}</div>`).join('');
}
function bindHistory(ov){/* just close */ }
function fmtDate(d){
  const p=d.split('-');const ws=['周日','周一','周二','周三','周四','周五','周六'];
  const dt=new Date(+p[0],+p[1]-1,+p[2]);
  return `${+p[1]}月${+p[2]}日 ${ws[dt.getDay()]}`;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){
  const t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}

// ==================== 安装提示 ====================
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferred=e;
  const b=document.createElement('div');b.className='install-banner';b.id='ib';
  b.innerHTML=`<span>📲 添加到主屏幕，每天摇一摇</span><button id="ibtn">添加</button><button class="install-close" id="iclose">✕</button>`;
  document.body.appendChild(b);
  document.getElementById('ibtn').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}b.remove()});
  document.getElementById('iclose').addEventListener('click',()=>b.remove());
});

// ==================== 初始化 ====================
function initDisplay(){
  const today=todayKey();
  if(data.todayRoll!==today){
    currentResults.qianling=rand(pools.qianling);
    currentResults.lover=rand(pools.lover);
    currentResults.verse=rand(pools.verse);
    $q.textContent=currentResults.qianling;$l.textContent=currentResults.lover;$v.textContent=currentResults.verse;
    history.unshift({date:today,time:new Date().toISOString(),results:{...currentResults}});
    if(history.length>200)history.length=200;
    saveHistory(history);data.todayRoll=today;saveData(data);
  }else{
    const te=history.filter(h=>h.date===today);
    if(te.length){currentResults={...te[0].results}}
    else{currentResults.qianling=rand(pools.qianling);currentResults.lover=rand(pools.lover);currentResults.verse=rand(pools.verse)}
    $q.textContent=currentResults.qianling;$l.textContent=currentResults.lover;$v.textContent=currentResults.verse;
  }
}

// ==================== 事件 ====================
$btn.addEventListener('click',roll);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!isRolling&&!panel){e.preventDefault();roll()}});
document.getElementById('editBtn').addEventListener('click',()=>openPanel('edit'));
document.getElementById('historyBtn').addEventListener('click',()=>openPanel('history'));

function singleRoll(cat,$card,$el,pool){
  return async function(){
    if(isRolling||panel||locked[cat])return;
    isRolling=true;$btn.disabled=true;
    currentResults[cat]=rand(pool);$card.classList.add('rolling');
    await animateCard($el,currentResults[cat],pool);
    $card.classList.remove('rolling');$card.classList.add('settled');
    setTimeout(()=>$card.classList.remove('settled'),350);
    playDing();isRolling=false;$btn.disabled=false;
  };
}
$cQ.addEventListener('click',singleRoll('qianling',$cQ,$q,pools.qianling));
$cL.addEventListener('click',singleRoll('lover',$cL,$l,pools.lover));
$cV.addEventListener('click',singleRoll('verse',$cV,$v,pools.verse));

// ==================== 启动 ====================
(function boot(){
  initDisplay();initShake();requestShake();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
