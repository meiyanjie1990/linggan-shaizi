<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFE3C8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<title>家庭灵感骰子</title>
<style>
/* ====== Reset ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --safe-bottom:env(safe-area-inset-bottom,16px);
  --font-title:'LXGW WenKai','STKaiti','KaiTi',serif;
  --font-text:'LXGW WenKai','STKaiti','KaiTi',serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --ink:#5C4526;
  --ink-soft:#8A6F4E;
  --ink-faint:#B3A183;
  --paper:#FFFEF8;
  --chip:#F5ECDA;
  --line:rgba(160,130,90,.22);
  --cw:clamp(170px,56vw,215px);
  --ch:calc(var(--cw)*1.5);
  --dx:clamp(56px,18vw,78px);
}
html{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);
  height:100%;display:flex;justify-content:center;align-items:center;
  background:#EFE3C8;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;overflow:hidden;
}

/* ====== Paper background ====== */
.paper-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 18%,#FBF4E6 0%,#F3E7CE 55%,#EFE3C8 100%);
}
.paper-bg::after{content:'';position:absolute;inset:0;opacity:.55;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(160,130,90,.022) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(160,130,90,.016) 0 1px,transparent 1px 5px),
    radial-gradient(ellipse 120% 90% at 50% 40%,transparent 60%,rgba(160,120,70,.06) 100%);
}

/* ====== Board ====== */
.board{
  position:relative;width:100%;max-width:420px;height:100%;
  display:flex;flex-direction:column;
  padding:16px 10px 0;z-index:1;
}

/* ====== Particles (warm dust) ====== */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) translateX(0) scale(0)}10%{opacity:var(--op)}90%{opacity:var(--op)}100%{opacity:0;transform:translateY(-100vh) translateX(var(--dx)) scale(1)}}

/* ====== Header ====== */
.header{text-align:center;padding:2px 0 0;flex-shrink:0;position:relative;z-index:1}
.header h1{
  font-size:1.15rem;font-weight:400;letter-spacing:.22em;
  color:var(--ink);font-family:var(--font-title);
}
.header .date{
  font-size:.68rem;color:var(--ink-faint);margin-top:5px;
  font-family:var(--font-ui);letter-spacing:.06em;
}

/* ====== Fan of cards ====== */
.fan{flex:1;position:relative;min-height:340px;margin-top:2px;z-index:1;touch-action:pan-y}

.card-slot{
  position:absolute;left:50%;top:50%;
  width:var(--cw);height:var(--ch);
  transition:transform .55s cubic-bezier(.3,1.35,.42,1);
  z-index:1;
}
.slot-left{transform:translate(calc(-50% - var(--dx)),calc(-50% + 6px)) rotate(-8deg)}
.slot-mid{transform:translate(-50%,calc(-50% - 16px)) rotate(0deg);z-index:2}
.slot-right{transform:translate(calc(-50% + var(--dx)),calc(-50% + 6px)) rotate(8deg)}
/* Flipped: straighten from the fan and lift */
.slot-left.has-flipped{transform:translate(calc(-50% - var(--dx)),calc(-50% + 6px)) rotate(-8deg);z-index:1}
.slot-mid.has-flipped{transform:translate(-50%,calc(-50% - 24px)) rotate(0deg);z-index:4}
.slot-right.has-flipped{transform:translate(calc(-50% + var(--dx)),calc(-50% + 6px)) rotate(8deg);z-index:1}

.card-item{position:absolute;inset:0;cursor:pointer;perspective:1200px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-inner.flipping-back{transition:transform .45s ease-in}
.card-face{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

/* ---- CARD BACK ---- */
.card-back{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 14px 34px rgba(120,90,50,.32);
  border-radius:13px;
  background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.16) 0%,transparent 50%);
}
.back-qianling{background-color:#C98B52;background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.2) 0%,transparent 50%),linear-gradient(155deg,#E8B07C,#C98B52)}
.back-lover{background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.2) 0%,transparent 50%),linear-gradient(155deg,#E0A0A8,#C9738A)}
.back-verse{background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.2) 0%,transparent 50%),linear-gradient(155deg,#A9BC9C,#7E9A78)}
.card-back::after{
  content:'';position:absolute;inset:6px;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.42);pointer-events:none;z-index:2;
}
.card-back-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.card-back-icon{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center}
.card-back-icon svg{width:28px;height:28px;display:block}
.card-back-label{font-size:.92rem;letter-spacing:.24em;color:#fff;font-family:var(--font-title);text-shadow:0 1px 4px rgba(120,60,30,.25);padding-left:.24em}

/* ---- CARD FRONT (paper) ---- */
.card-front{
  background:var(--paper);transform:rotateY(180deg);
  box-shadow:0 16px 40px rgba(120,90,50,.32);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  border:1px solid var(--line);
  background-image:
    radial-gradient(circle at 28% 18%,rgba(255,255,255,.7) 0%,transparent 55%),
    repeating-linear-gradient(0deg,rgba(160,130,90,.028) 0 1px,transparent 1px 3px);
}
.front-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.front-icon svg{width:20px;height:20px}
.front-body{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;z-index:1;padding-bottom:18px}
.front-label{font-size:.64rem;color:var(--ink-faint);letter-spacing:.14em;font-family:var(--font-title)}
.front-text{font-size:.86rem;line-height:1.72;font-family:var(--font-text);word-break:break-word;display:flex;align-items:center;color:#46341F}
.front-actions{display:flex;align-items:center;gap:6px;position:absolute;bottom:12px;right:14px;z-index:2}

/* Front buttons */
.front-btn{
  padding:5px 12px;border-radius:999px;border:none;
  background:var(--chip);font-size:.68rem;cursor:pointer;
  font-family:var(--font-title);color:var(--ink-soft);transition:all .2s;
  display:flex;align-items:center;gap:3px;white-space:nowrap;letter-spacing:.04em;
}
.front-btn:active{transform:scale(.93)}
.front-btn.done-btn{background:#FBE7D8;color:#C05B32}
.front-btn.done-btn.did{background:#F6D8C4;color:#A55838;opacity:.85}
.front-btn.mem-btn{background:#EFE7CC;color:#8A6F4E}
.front-lock{width:7px;height:7px;border-radius:50%;background:#D8C9AC;transition:all .25s;flex-shrink:0}
.front-lock.active{background:#C05B32;box-shadow:0 0 5px rgba(192,91,50,.5)}

/* Flip glow */
.card-glow{
  position:absolute;inset:-24px;pointer-events:none;z-index:0;
  background:radial-gradient(circle at center,rgba(196,160,106,.2) 0%,transparent 70%);
  opacity:0;transition:opacity .3s;border-radius:20px;
}
.card-glow.active{opacity:1;transition:opacity 0s}
.card-glow.fading{opacity:0;transition:opacity .8s ease-out}

/* ====== Hint ====== */
.hint{text-align:center;font-size:.62rem;color:var(--ink-faint);font-family:var(--font-ui);letter-spacing:.08em;margin-top:6px;flex-shrink:0;position:relative;z-index:1}

/* ====== Stats Track ====== */
.stats-track{display:flex;align-items:center;justify-content:center;padding:2px 0 0;flex-shrink:0;position:relative;z-index:1}
.stats-inner{display:flex;align-items:center;gap:4px}
.stat-item{
  display:flex;align-items:center;gap:4px;cursor:pointer;
  padding:4px 11px;border-radius:999px;background:var(--chip);
  transition:background .2s,transform .2s;
  font-size:.66rem;color:var(--ink-soft);font-family:var(--font-ui);
  white-space:nowrap;
}
.stat-item:active{background:#EDE0C4;transform:scale(.95)}
.stat-item .stat-num{color:var(--ink);font-weight:700;font-family:var(--font-title);font-size:.8rem}
.stat-divider{width:1px;height:12px;background:rgba(160,130,90,.25)}

/* ====== Actions ====== */
.actions{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 0 calc(4px + var(--safe-bottom));position:relative;z-index:1}
.reset-btn{
  padding:9px 32px;border-radius:999px;border:none;
  background:var(--ink);color:#FAF3E0;
  font-size:.8rem;cursor:pointer;font-family:var(--font-title);letter-spacing:.16em;
  transition:all .2s;
  box-shadow:0 4px 14px rgba(92,69,38,.3);
}
.reset-btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(92,69,38,.25)}
.reset-btn:disabled{opacity:.35;cursor:not-allowed}

/* ====== Bottom Nav ====== */
.bottom-nav{display:flex;justify-content:center;gap:8px;padding:0 8px 10px;flex-shrink:0;position:relative;z-index:2}
.nav-btn{
  padding:5px 13px;border-radius:7px;border:1px solid var(--line);
  background:rgba(255,254,248,.65);font-size:.68rem;cursor:pointer;
  color:var(--ink-soft);font-family:var(--font-title);letter-spacing:.06em;
  transition:all .2s;white-space:nowrap;
}
.nav-btn:active{background:#F5ECDA;color:var(--ink);transform:scale(.95)}

/* ====== Panels ====== */
.panel-overlay{position:fixed;inset:0;background:rgba(60,42,20,.45);z-index:100;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{
  background:linear-gradient(180deg,#FFFEF8,#F6EFE0);width:100%;max-width:420px;
  max-height:80vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  animation:slideUp .3s ease;padding-bottom:var(--safe-bottom);
  color:#46341F;border-top:2px solid rgba(196,160,106,.45);
  box-shadow:0 -8px 30px rgba(60,42,20,.25);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 8px}
.panel-header h3{font-size:.95rem;font-weight:400;font-family:var(--font-title);letter-spacing:.06em;color:var(--ink)}
.panel-header .panel-export{
  font-size:.66rem;color:var(--ink-soft);cursor:pointer;padding:4px 11px;border-radius:999px;
  border:1px solid var(--line);font-family:var(--font-title);
  transition:all .2s;background:rgba(255,254,248,.8);
}
.panel-header .panel-export:active{background:var(--chip)}
.panel-close{width:28px;height:28px;border:1px solid var(--line);background:transparent;border-radius:50%;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}

/* Panel tabs */
.panel-tabs{display:flex;padding:0 16px;gap:6px;margin-bottom:6px}
.panel-tab{
  padding:6px 13px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,254,248,.8);font-size:.72rem;cursor:pointer;
  color:var(--ink-soft);font-family:var(--font-title);transition:all .2s;
}
.panel-tab.active{background:var(--ink);color:#FAF3E0;border-color:var(--ink)}

/* Panel list */
.panel-list{flex:1;overflow-y:auto;padding:4px 16px 8px;-webkit-overflow-scrolling:touch}
.panel-item{
  padding:11px 0;border-bottom:1px solid rgba(160,130,90,.12);
  font-size:.82rem;line-height:1.6;font-family:var(--font-text);
}
.panel-item .pi-date{font-size:.65rem;color:var(--ink-faint);margin-bottom:3px;font-family:var(--font-ui)}
.panel-item .pi-tag{
  display:inline-block;font-size:.6rem;padding:1px 8px;border-radius:999px;
  margin-right:4px;font-family:var(--font-ui);
}
.pi-tag.funny{background:#FDF3EF;color:#E8927C}
.pi-tag.surprise{background:#FDF9EF;color:#C4A86C}
.pi-tag.reflect{background:#F0F0F8;color:#8B8BC0}
.pi-tag.milestone{background:#EEF8EE;color:#7BA07B}

/* Panel add bar */
.panel-add{
  display:flex;gap:6px;padding:9px 16px;border-top:1px solid rgba(160,130,90,.14);
  align-items:center;
}
.panel-add input, .panel-add select{
  padding:8px 11px;border:1px solid var(--line);border-radius:12px;
  font-size:.76rem;font-family:var(--font-text);background:var(--paper);color:#46341F;outline:none;
}
.panel-add input:focus{border-color:rgba(160,130,90,.5)}
.panel-add input{flex:1}
.panel-add select{width:64px;font-size:.7rem}
.panel-add button{
  padding:8px 15px;border:none;border-radius:12px;
  background:var(--ink);color:#FAF3E0;font-size:.76rem;cursor:pointer;font-family:var(--font-title);
}
.panel-add button:active{background:#46341F}

/* Edit panel specific */
.edit-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(160,130,90,.12);font-size:.8rem;line-height:1.55;font-family:var(--font-text)}
.edit-item span{flex:1;word-break:break-word}
.edit-item-del{width:24px;height:24px;border:none;background:transparent;font-size:.9rem;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#C9B896}
.edit-item-del:active{color:#c0392b}

.empty-state{text-align:center;color:#C9B896;padding:34px 20px;font-size:.8rem;font-family:var(--font-text);line-height:1.8}

/* Toast */
.toast{
  position:fixed;top:52px;left:50%;transform:translateX(-50%);
  background:rgba(92,69,38,.94);color:#FAF3E0;padding:7px 18px;
  border-radius:999px;font-size:.72rem;z-index:200;pointer-events:none;
  font-family:var(--font-title);letter-spacing:.06em;
  border:1px solid rgba(196,160,106,.4);
  animation:toastIn .25s ease,toastOut .25s ease 1.5s forwards;
  box-shadow:0 4px 14px rgba(60,42,20,.3);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Sparkle burst */
.sparkle{position:fixed;pointer-events:none;z-index:90;animation:sparkleBurst .85s ease-out forwards}
@keyframes sparkleBurst{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0) rotate(var(--sr))}}

@media (prefers-reduced-motion:reduce){
  .card-inner,.card-slot{transition:none!important}
  .sparkle,.particle{animation:none!important;display:none}
  .panel{animation:none}
  .card-glow{display:none}
}
</style>
</head>
<body>

<div class="paper-bg"></div>
<div id="particles"></div>

<div class="board">
  <header class="header">
    <h1>家庭灵感骰子</h1>
    <div class="date" id="dateDisplay"></div>
  </header>

  <div class="fan">
    <!-- Qianling Slot (left) -->
    <div class="card-slot slot-left" id="slotQianling">
      <div class="card-glow" id="glowQianling"></div>
      <div class="card-item" id="cardItemQianling">
        <div class="card-inner" id="cardInnerQianling">
          <div class="card-face card-back back-qianling" id="backQianling">
            <div class="card-back-inner">
              <div class="card-back-icon"><svg viewBox="0 0 56 56"><defs><radialGradient id="gq5" cx="40%" cy="35%"><stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M28 3 L33 19 L50 19 L35 30 L41 47 L28 37 L15 47 L21 30 L6 19 L23 19 Z" fill="url(#gq5)"/></svg></div>
              <span class="card-back-label">和 谦 灵 玩</span>
            </div>
          </div>
          <div class="card-face card-front">
            <div class="front-icon" style="background:#FBE7D8"><svg viewBox="0 0 26 26"><path d="M13 1 L16 10 L26 10 L18 16 L21 25 L13 19 L5 25 L8 16 L0 10 L10 10 Z" fill="#D9774E" opacity=".85"/></svg></div>
            <div class="front-body">
              <div class="front-label">和谦灵玩</div>
              <div class="front-text" id="textQianling"></div>
            </div>
            <div class="front-actions">
              <div class="front-lock" id="lockDotQianling"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lover Slot (mid) -->
    <div class="card-slot slot-mid" id="slotLover">
      <div class="card-glow" id="glowLover"></div>
      <div class="card-item" id="cardItemLover">
        <div class="card-inner" id="cardInnerLover">
          <div class="card-face card-back back-lover" id="backLover">
            <div class="card-back-inner">
              <div class="card-back-icon"><svg viewBox="0 0 56 56"><defs><radialGradient id="gl5" cx="40%" cy="35%"><stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M28 49 C15 37 3 26 3 16 C3 7 10 0 19 0 C24 0 28 4 28 9 C28 4 32 0 37 0 C46 0 53 7 53 16 C53 26 41 37 28 49Z" fill="url(#gl5)"/></svg></div>
              <span class="card-back-label">为 爱 人 做</span>
            </div>
          </div>
          <div class="card-face card-front">
            <div class="front-icon" style="background:#FBE0E4"><svg viewBox="0 0 26 26"><path d="M13 24 C7 18 1 13 1 8 C1 3 5 0 9 0 C12 0 14 2 13 5 C12 2 14 0 17 0 C21 0 25 3 25 8 C25 13 19 18 13 24Z" fill="#C9738A" opacity=".85"/></svg></div>
            <div class="front-body">
              <div class="front-label">为爱人做</div>
              <div class="front-text" id="textLover"></div>
            </div>
            <div class="front-actions">
              <button class="front-btn done-btn" id="doneBtn" title="今天做到了">✓ 做到了</button>
              <div class="front-lock" id="lockDotLover"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Verse Slot (right) -->
    <div class="card-slot slot-right" id="slotVerse">
      <div class="card-glow" id="glowVerse"></div>
      <div class="card-item" id="cardItemVerse">
        <div class="card-inner" id="cardInnerVerse">
          <div class="card-face card-back back-verse" id="backVerse">
            <div class="card-back-inner">
              <div class="card-back-icon"><svg viewBox="0 0 56 56"><defs><radialGradient id="gv5" cx="50%" cy="30%"><stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M28 49 C35 37 46 26 46 17 C46 7 37 3 28 3 C19 3 10 7 10 17 C10 26 21 37 28 49Z" fill="url(#gv5)"/><circle cx="28" cy="19" r="8" fill="none" stroke="#fff" stroke-width=".8" opacity=".4"/></svg></div>
              <span class="card-back-label">今 日 经 文</span>
            </div>
          </div>
          <div class="card-face card-front">
            <div class="front-icon" style="background:#EFE7CC"><svg viewBox="0 0 26 26"><path d="M13 24 C18 19 23 13 23 9 C23 4 19 1 13 1 C7 1 3 4 3 9 C3 13 8 19 13 24Z" fill="#B39B58" opacity=".85"/><circle cx="13" cy="9" r="3.5" fill="none" stroke="#B39B58" stroke-width=".8" opacity=".5"/></svg></div>
            <div class="front-body">
              <div class="front-label">今日经文</div>
              <div class="front-text" id="textVerse"></div>
            </div>
            <div class="front-actions">
              <button class="front-btn mem-btn" id="memorizeBtn" title="背诵这节">📖 背诵</button>
              <div class="front-lock" id="lockDotVerse"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">左右滑动选牌 · 点牌翻开</div>

  <!-- Stats Track -->
  <div class="stats-track">
    <div class="stats-inner">
      <div class="stat-item" id="statGrowth">
        <span>🌱</span><span class="stat-num" id="numGrowth">0</span><span>记录</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item" id="statVerses">
        <span>📖</span><span class="stat-num" id="numVerses">0</span><span>背诵</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item" id="statActions">
        <span>💑</span><span class="stat-num" id="numActions">0</span><span>做到</span>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="reset-btn" id="resetBtn">重新洗牌</button>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">

// ==================================================================
//  State
// ==================================================================
const SK='ls-v5',HK='ls-v5-hist',GK='ls-v5-growth',VK='ls-v5-verses',AK='ls-v5-actions';
function ld(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}
function sd(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let data=ld(SK,{pools:null,locked:{},todayRoll:null});
let pools=data.pools?{...DEFAULT_POOLS,...data.pools}:{...DEFAULT_POOLS};
let locked=data.locked||{qianling:false,lover:false,verse:false};
let history=ld(HK,[]);
let growthRecords=ld(GK,[]);
let memorizedVerses=ld(VK,[]);
let loverActions=ld(AK,[]);
let flipped={qianling:false,lover:false,verse:false};
let currentResults={qianling:'',lover:'',verse:''};
let animating=false;
let todayDone={lover:false,verse:false}; // track if already clicked today

// Stats
function updateStats(){
  document.getElementById('numGrowth').textContent=growthRecords.length;
  document.getElementById('numVerses').textContent=memorizedVerses.length;
  document.getElementById('numActions').textContent=loverActions.length;
}
updateStats();

// ==================================================================
//  Utils
// ==================================================================
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(d){const p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]),ws=['周日','周一','周二','周三','周四','周五','周六'];return `${+p[1]}月${+p[2]}日 ${ws[dt.getDay()]}`}

// ==================================================================
//  Date display
// ==================================================================
(function(){const n=new Date();const ws=['周日','周一','周二','周三','周四','周五','周六'];document.getElementById('dateDisplay').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日　${ws[n.getDay()]}`})();

//  Lock
// ==================================================================
const lockDots={qianling:document.getElementById('lockDotQianling'),lover:document.getElementById('lockDotLover'),verse:document.getElementById('lockDotVerse')};
function updLocks(){for(const c of['qianling','lover','verse']){lockDots[c].className='front-lock'+(locked[c]?' active':'')}}
updLocks();
for(const c of['qianling','lover','verse']){lockDots[c].addEventListener('click',e=>{e.stopPropagation();locked[c]=!locked[c];updLocks();data.locked=locked;sd(SK,data)})}

// ==================================================================
//  Text animation
// ==================================================================
async function animText($el,finalText,pool,dur=650){
  const steps=10;let step=0;
  return new Promise(resolve=>{
    function next(){if(step>=steps){$el.textContent=finalText;resolve();return}let t;do{t=rand(pool)}while(t===$el.textContent&&pool.length>1);$el.textContent=t;step++;setTimeout(next,20+Math.pow(step/steps,3)*160)}
    next();
  });
}

// ==================================================================
//  Flip glow
// ==================================================================
function triggerGlow(cat){
  const g=document.getElementById('glow'+cat.charAt(0).toUpperCase()+cat.slice(1));
  g.classList.add('active');
  requestAnimationFrame(()=>{g.classList.remove('active');g.classList.add('fading')});
  setTimeout(()=>g.classList.remove('fading'),800);
}

// ==================================================================
//  Flip
// ==================================================================
const texts={qianling:document.getElementById('textQianling'),lover:document.getElementById('textLover'),verse:document.getElementById('textVerse')};
const inners={qianling:document.getElementById('cardInnerQianling'),lover:document.getElementById('cardInnerLover'),verse:document.getElementById('cardInnerVerse')};
const slots={qianling:document.getElementById('slotQianling'),lover:document.getElementById('slotLover'),verse:document.getElementById('slotVerse')};
const doneBtn=document.getElementById('doneBtn');
const memorizeBtn=document.getElementById('memorizeBtn');

// Check if today's items already done/memorized
function checkTodayDone(){
  const today=todayKey();
  todayDone.lover=loverActions.some(a=>a.text===currentResults.lover&&a.date===today);
  todayDone.verse=memorizedVerses.some(v=>v.text===currentResults.verse&&v.date===today);
  doneBtn.className='front-btn done-btn'+(todayDone.lover?' did':'');
  memorizeBtn.textContent=todayDone.verse?'📖 已背':'📖 背诵';
  memorizeBtn.style.opacity=todayDone.verse?'0.6':'1';
}
checkTodayDone();

doneBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(todayDone.lover||!flipped.lover)return;
  const today=todayKey();
  loverActions.unshift({text:currentResults.lover,date:today,time:new Date().toISOString()});
  sd(AK,loverActions);todayDone.lover=true;
  doneBtn.className='front-btn done-btn did';
  updateStats();clickSound();
  toast('✓ 已记录');
});

memorizeBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(todayDone.verse||!flipped.verse)return;
  const today=todayKey();
  memorizedVerses.unshift({text:currentResults.verse,date:today,time:new Date().toISOString()});
  sd(VK,memorizedVerses);todayDone.verse=true;
  memorizeBtn.textContent='📖 已背';memorizeBtn.style.opacity='0.6';
  updateStats();clickSound();
  toast('📖 已收藏');
});

async function flip(cat){
  if(animating||flipped[cat]||locked[cat])return;animating=true;
  currentResults[cat]=rand(pools[cat]);
  inners[cat].classList.add('flipped');await sleep(400);
  triggerGlow(cat);
  await animText(texts[cat],currentResults[cat],pools[cat]);
  flipped[cat]=true;slots[cat].classList.add('has-flipped');clickSound();
  if(flipped.qianling&&flipped.lover&&flipped.verse){spawnSparkles();dingSound()}
  if(flipped.qianling&&flipped.lover&&flipped.verse){
    const t=todayKey();history.unshift({date:t,time:new Date().toISOString(),results:{...currentResults}});
    if(history.length>200)history.length=200;sd(HK,history);data.todayRoll=t;sd(SK,data);
  }
  checkTodayDone();
  animating=false;
}

// ==================================================================
//  Reset
// ==================================================================
const $reset=document.getElementById('resetBtn');
async function resetAll(){
  if(animating||(!flipped.qianling&&!flipped.lover&&!flipped.verse))return;
  animating=true;$reset.disabled=true;
  for(const c of['qianling','lover','verse']){if(flipped[c]){inners[c].classList.add('flipping-back');inners[c].classList.remove('flipped');slots[c].classList.remove('has-flipped')}}
  await sleep(500);
  for(const c of['qianling','lover','verse']){inners[c].classList.remove('flipping-back');flipped[c]=false;texts[c].textContent=''}
  todayDone={lover:false,verse:false};checkTodayDone();
  animating=false;$reset.disabled=false;
}

//  Sparkles
// ==================================================================
function spawnSparkles(){
  const colors=['#C4A068','#E8D5A0','#D9774E','#C9738A','#B39B58','#fff'];
  for(let i=0;i<35;i++){setTimeout(()=>{const s=document.createElement('div');s.className='sparkle';s.style.cssText=`left:${15+Math.random()*70}%;top:${10+Math.random()*80}%;width:${2+Math.random()*7}px;height:${2+Math.random()*7}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};--sx:${(Math.random()-.5)*140}px;--sy:${(Math.random()-.5)*140-50}px;--sr:${(Math.random()-.5)*360}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),850)},i*12)}
}

// ==================================================================
//  Sounds
// ==================================================================
function clickSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.start(t);o.stop(t+.06)}catch(e){}}
function dingSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime;[0,.1].forEach((off,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=i===0?784:1047;g.gain.setValueAtTime(.08,t+off);g.gain.exponentialRampToValueAtTime(.001,t+off+.22);o.start(t+off);o.stop(t+off+.22)})}catch(e){}}

// ==================================================================
//  Events
// ==================================================================
// 点侧牌：先转到中间再翻开；点中间牌：直接翻开
function tapCard(cat){
  const idx=deckOrder.indexOf(cat);
  if(idx===1){flip(cat);return;}
  if(idx===0){deckOrder.unshift(deckOrder.pop())}else{deckOrder.push(deckOrder.shift())}
  renderDeck();clickSound();
  if(!flipped[cat]&&!locked[cat])setTimeout(()=>flip(cat),320);
}
document.getElementById('cardItemQianling').addEventListener('click',()=>tapCard('qianling'));
document.getElementById('cardItemLover').addEventListener('click',()=>tapCard('lover'));
document.getElementById('cardItemVerse').addEventListener('click',()=>tapCard('verse'));

// ---- 滑动选牌：左右滑动让下一张牌转到中间 ----
const fanEl=document.querySelector('.fan');
const deckOrder=['qianling','lover','verse'];
let suppressClickUntil=0;
fanEl.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.stopPropagation()}},true);
function renderDeck(){
  deckOrder.forEach((cat,i)=>{
    const el=slots[cat];
    el.classList.remove('slot-left','slot-mid','slot-right');
    el.classList.add(['slot-left','slot-mid','slot-right'][i]);
    el.classList.toggle('has-flipped',flipped[cat]);
  });
}
let swipeX=null,swipeY=null,isSwiping=false,swipePointer=null;
fanEl.addEventListener('pointerdown',e=>{
  swipeX=e.clientX;swipeY=e.clientY;isSwiping=false;swipePointer=e.pointerId;
  try{fanEl.setPointerCapture(e.pointerId)}catch(err){}
});
fanEl.addEventListener('pointermove',e=>{
  if(swipeX===null||e.pointerId!==swipePointer)return;
  if(Math.abs(e.clientX-swipeX)>12&&Math.abs(e.clientX-swipeX)>Math.abs(e.clientY-swipeY)){
    isSwiping=true;
    if(e.cancelable)e.preventDefault();
  }
});
fanEl.addEventListener('pointerup',e=>{
  if(swipeX===null||e.pointerId!==swipePointer)return;
  const dx=e.clientX-swipeX;
  swipeX=null;swipeY=null;swipePointer=null;
  const wasSwiping=isSwiping;isSwiping=false;
  if(!wasSwiping||Math.abs(dx)<36)return;
  if(dx<0){deckOrder.push(deckOrder.shift())}else{deckOrder.unshift(deckOrder.pop())}
  renderDeck();clickSound();
  suppressClickUntil=Date.now()+400;
});
fanEl.addEventListener('pointercancel',()=>{swipeX=null;swipeY=null;swipePointer=null;isSwiping=false;});
$reset.addEventListener('click',resetAll);
let panelActive=false;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!animating&&!panelActive){e.preventDefault();if(flipped.qianling&&flipped.lover&&flipped.verse)resetAll();else{const s=deckOrder.find(k=>!flipped[k]&&!locked[k]);if(s)tapCard(s)}}});

    html=`<div class="panel"><div class="panel-header"><h3>翻牌记录</h3><button class="panel-close" id="pc">✕</button></div><div class="panel-list" id="pl"></div></div>`;
  }else if(type==='growth'){
    html=`<div class="panel"><div class="panel-header"><h3>🌱 谦灵成长记录</h3><div style="display:flex;gap:8px;align-items:center"><button class="panel-export" id="pexport">导出</button><button class="panel-close" id="pc">✕</button></div></div><div class="panel-list" id="pl"></div><div class="panel-add"><select id="ptag"><option value="funny">有趣</option><option value="surprise">惊喜</option><option value="reflect">反思</option><option value="milestone">里程碑</option></select><input id="pi" placeholder="记录谦灵的一件事..."><button id="pa">保存</button></div></div>`;
  }else if(type==='collection'){
    html=`<div class="panel"><div class="panel-header"><h3>⭐ 我的收藏</h3><button class="panel-close" id="pc">✕</button></div><div class="panel-tabs"><button class="panel-tab active" data-t="verses">📖 背诵经文</button><button class="panel-tab" data-t="actions">💑 爱人行动</button></div><div class="panel-list" id="pl"></div><div style="padding:8px 16px;border-top:1px solid rgba(160,130,90,.14)"><button class="panel-export" id="pexport" style="font-size:.68rem">导出当前列表</button></div></div>`;
  }
  ov.innerHTML=html;document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closePanel()});
  ov.querySelector('#pc').addEventListener('click',()=>closePanel());
  if(type==='edit')bindEdit(ov);
  else if(type==='history')renderHistory();
  else if(type==='growth')bindGrowth(ov);
  else if(type==='collection')bindCollection(ov);
}
function closePanel(){if(!panelActive)return;const ov=document.querySelector('.panel-overlay');if(ov)ov.remove();panelActive=false}

// Edit
function bindEdit(ov){
  renderEditList();
  ov.querySelectorAll('.panel-tab').forEach(t=>t.addEventListener('click',()=>{panelCat=t.dataset.c;ov.querySelectorAll('.panel-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderEditList()}));
  ov.querySelector('#pa').addEventListener('click',()=>{const v=document.getElementById('pi').value.trim();if(v){pools[panelCat].push(v);savePools();renderEditList();document.getElementById('pi').value=''}document.getElementById('pi').focus()});
  ov.querySelector('#pi').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){pools[panelCat].push(v);savePools();renderEditList();e.target.value=''}}});
}
function renderEditList(){
  const el=document.getElementById('pl');if(!el)return;
  const items=pools[panelCat];
  el.innerHTML=items.length?items.map((s,i)=>`<div class="edit-item"><span>${esc(s)}</span><button class="edit-item-del" data-i="${i}">✕</button></div>`).join(''):'<div class="empty-state">还没有内容 ✨</div>';
  el.querySelectorAll('.edit-item-del').forEach(b=>b.addEventListener('click',()=>{pools[panelCat].splice(+b.dataset.i,1);savePools();renderEditList()}));
}
function savePools(){data.pools={};for(const c of['qianling','lover','verse']){if(JSON.stringify(pools[c])!==JSON.stringify(DEFAULT_POOLS[c]))data.pools[c]=pools[c]}sd(SK,data)}

// History
function renderHistory(){
  const el=document.getElementById('pl');if(!el)return;
  if(!history.length){el.innerHTML='<div class="empty-state">还没有翻过牌 🎲</div>';return}
  const g={};history.forEach(h=>{if(!g[h.date])g[h.date]=[];g[h.date].push(h)});
  el.innerHTML=Object.entries(g).map(([d,rs])=>`<div class="history-group" style="margin-bottom:14px"><div style="font-size:.68rem;color:#B3A183;margin-bottom:4px;font-family:var(--font-ui)">${fmtDate(d)}</div>${rs.map(r=>`<div style="background:#FBF4E6;border-radius:10px;padding:8px 12px;margin-bottom:5px;font-size:.76rem;line-height:1.6;font-family:var(--font-text);border:1px solid rgba(160,130,90,.1)"><div>✦ ${esc(r.results.qianling)}</div><div>❤ ${esc(r.results.lover)}</div><div>✟ ${esc(r.results.verse)}</div></div>`).join('')}</div>`).join('');
}

// Growth
function bindGrowth(ov){
  renderGrowthList();
  ov.querySelector('#pa').addEventListener('click',addGrowth);
  ov.querySelector('#pi').addEventListener('keydown',e=>{if(e.key==='Enter')addGrowth()});
  const exportBtn=ov.querySelector('#pexport');
  if(exportBtn)exportBtn.addEventListener('click',exportGrowth);
}
function addGrowth(){
  const inp=document.getElementById('pi');const tag=document.getElementById('ptag');
  if(!inp||!tag)return;const v=inp.value.trim();if(!v)return;
  growthRecords.unshift({text:v,tag:tag.value,date:todayKey(),time:new Date().toISOString()});
  sd(GK,growthRecords);updateStats();renderGrowthList();inp.value='';toast('🌱 已记录');
}
function renderGrowthList(){
  const el=document.getElementById('pl');if(!el)return;
  if(!growthRecords.length){el.innerHTML='<div class="empty-state">还没有成长记录 🌱<br>记录谦灵今天有趣的一句话、一个动作</div>';return}
  const tags={funny:'有趣',surprise:'惊喜',reflect:'反思',milestone:'里程碑'};
  el.innerHTML=growthRecords.map(r=>`<div class="panel-item"><div class="pi-date">${fmtDate(r.date)} <span class="pi-tag ${r.tag}">${tags[r.tag]||r.tag}</span></div><div>${esc(r.text)}</div></div>`).join('');
}
function exportGrowth(){
  if(!growthRecords.length){toast('没有可导出的记录');return}
  const tags={funny:'有趣',surprise:'惊喜',reflect:'反思',milestone:'里程碑'};
  let txt='谦灵成长记录\n'+'='.repeat(30)+'\n\n';
  growthRecords.forEach(r=>{txt+=`${r.date} [${tags[r.tag]||r.tag}]\n${r.text}\n\n`});
  downloadFile('谦灵成长记录.txt',txt);toast('✅ 已导出');
}

// Collection (verses + actions)
function bindCollection(ov){
  renderCollectionList();
  ov.querySelectorAll('.panel-tab').forEach(t=>t.addEventListener('click',()=>{panelTab=t.dataset.t;ov.querySelectorAll('.panel-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderCollectionList()}));
  const exportBtn=ov.querySelector('#pexport');
  if(exportBtn)exportBtn.addEventListener('click',()=>{
    if(panelTab==='verses')exportVerses();else exportActions();
  });
}
function renderCollectionList(){
  const el=document.getElementById('pl');if(!el)return;
  if(panelTab==='verses'){
    if(!memorizedVerses.length){el.innerHTML='<div class="empty-state">还没有背诵的经文 📖<br>翻开经文卡，点「背诵」收藏</div>';return}
    el.innerHTML=memorizedVerses.map(v=>`<div class="panel-item"><div class="pi-date">${fmtDate(v.date)}</div><div>${esc(v.text)}</div></div>`).join('');
  }else{
    if(!loverActions.length){el.innerHTML='<div class="empty-state">还没有记录 💑<br>翻开爱人卡，点「做到了」记录</div>';return}
    el.innerHTML=loverActions.map(a=>`<div class="panel-item"><div class="pi-date">${fmtDate(a.date)}</div><div>${esc(a.text)}</div></div>`).join('');
  }
}
function exportVerses(){
  if(!memorizedVerses.length){toast('没有可导出的经文');return}
  let txt='已背诵经文\n'+'='.repeat(24)+'\n\n';
  memorizedVerses.forEach(v=>{txt+=`${v.date}\n${v.text}\n\n`});
  downloadFile('背诵经文.txt',txt);toast('✅ 已导出');
}
function exportActions(){
  if(!loverActions.length){toast('没有可导出的记录');return}
  let txt='为爱人做的事\n'+'='.repeat(24)+'\n\n';
  loverActions.forEach(a=>{txt+=`${a.date}\n${a.text}\n\n`});
  downloadFile('为爱人做的事.txt',txt);toast('✅ 已导出');
}
function downloadFile(filename,text){
  const b=new Blob(['﻿'+text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();
  URL.revokeObjectURL(a.href);
}

// Nav
document.getElementById('navEdit').addEventListener('click',()=>openPanel('edit'));
document.getElementById('navHistory').addEventListener('click',()=>openPanel('history'));
document.getElementById('navGrowth').addEventListener('click',()=>openPanel('growth'));
document.getElementById('navCollection').addEventListener('click',()=>openPanel('collection'));
document.getElementById('statGrowth').addEventListener('click',()=>openPanel('growth'));
document.getElementById('statVerses').addEventListener('click',()=>openPanel('collection'));
document.getElementById('statActions').addEventListener('click',()=>{panelTab='actions';openPanel('collection')});

// ==================================================================
//  Particles (warm dust)
// ==================================================================
(function(){
  const container=document.getElementById('particles');
  const colors=['rgba(196,160,106,.4)','rgba(217,119,78,.3)','rgba(201,115,138,.28)','rgba(255,255,255,.3)'];
  function spawn(){
    const p=document.createElement('div');p.className='particle';
    const size=1.5+Math.random()*3;
    p.style.cssText=`left:${Math.random()*100}%;bottom:-10px;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${(Math.random()-.5)*50}px;--op:${.22+Math.random()*.4};animation-duration:${8+Math.random()*10}s`;
    container.appendChild(p);setTimeout(()=>p.remove(),18000);
  }
  setInterval(spawn,1100);
  for(let i=0;i<6;i++)setTimeout(spawn,i*350);
})();

// ==================================================================
//  Toast
// ==================================================================
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

// ==================================================================
//  Install
// ==================================================================
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.createElement('div');b.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;background:rgba(92,69,38,.96);border-radius:14px;padding:12px 16px;box-shadow:0 4px 24px rgba(60,42,20,.4);z-index:50;display:flex;align-items:center;gap:10px;color:#FAF3E0;font-family:var(--font-title);border:1px solid rgba(196,160,106,.4)';b.innerHTML=`<span style="flex:1;font-size:.74rem">📲 添加到主屏幕，每天翻牌</span><button id="ibtn" style="padding:6px 14px;border:1px solid rgba(196,160,106,.5);border-radius:999px;background:rgba(196,160,106,.2);color:#FAF3E0;font-size:.74rem;cursor:pointer;font-family:var(--font-title)">添加</button><button id="iclose" style="background:transparent;border:none;color:rgba(250,243,224,.5);font-size:1rem;padding:4px 6px;cursor:pointer">✕</button>`;document.body.appendChild(b);document.getElementById('ibtn').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}b.remove()});document.getElementById('iclose').addEventListener('click',()=>b.remove())});

// ==================================================================
//  Boot
// ==================================================================
(function(){
  const today=todayKey();
  if(data.todayRoll!==today){
    currentResults.qianling=rand(pools.qianling);currentResults.lover=rand(pools.lover);currentResults.verse=rand(pools.verse);
  }else{
    const te=history.filter(h=>h.date===today);
    currentResults=te.length?{...te[0].results}:{qianling:rand(pools.qianling),lover:rand(pools.lover),verse:rand(pools.verse)};
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='reload-new-version')location.reload()});
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
