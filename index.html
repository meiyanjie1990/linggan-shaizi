<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<title>家庭灵感骰子</title>
<style>
/* ====== Reset & Base ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --table:#1A1410;
  --gold:#D4B87A;
  --gold-dim:#A89060;
  --accent-qianling:#E8927C;
  --accent-lover:#C4929E;
  --accent-verse:#C4A86C;
  --card-front:#FDFAF5;
  --ink:#3D3226;
  --ink-light:#8B7D6E;
  --ink-faint:#BFB5A8;
  --hairline:rgba(61,50,38,.1);
  --shadow-card:0 8px 30px rgba(0,0,0,.45);
  --shadow-flipped:0 4px 16px rgba(0,0,0,.25);
  --radius:14px;
  --font-title:'ZCOOL XiaoWei',serif;
  --font-text:'Noto Serif SC','STSong','Songti SC',serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
html{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);
  background:var(--table);
  height:100%;display:flex;justify-content:center;align-items:center;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;overflow:hidden;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 30%,#2A2015 0%,transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 80%,#1E1810 0%,transparent 60%),
    var(--table);
}

/* ====== Floating particles ====== */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.particle{
  position:absolute;border-radius:50%;
  animation:floatUp linear infinite;
  opacity:0;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) translateX(0) scale(0)}
  10%{opacity:var(--op)}
  90%{opacity:var(--op)}
  100%{opacity:0;transform:translateY(-100vh) translateX(var(--dx)) scale(1)}
}

/* ====== App ====== */
.app{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding:20px 16px 0;position:relative;z-index:1}

/* ====== Header ====== */
.header{text-align:center;padding:6px 0 2px;flex-shrink:0}
.header h1{font-size:1.4rem;font-weight:400;letter-spacing:.12em;color:rgba(255,255,255,.82);font-family:var(--font-title)}
.header .date{font-size:.68rem;color:rgba(255,255,255,.35);margin-top:4px;font-family:var(--font-text);letter-spacing:.06em}

/* ====== Cards ====== */
.cards-area{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;padding:8px 4px;perspective:1200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card-item{position:relative;height:150px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-inner.flipping-back{transition:transform .45s ease-in}
.card-face{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

/* ---- CARD BACK ---- */
.card-back{display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow-card);border:2px solid rgba(255,255,255,.06)}
.card-back-inner{text-align:center;position:relative;z-index:1}
.card-back-icon svg{width:54px;height:54px;display:block;margin:0 auto 8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.card-back-label{font-size:.78rem;letter-spacing:.12em;color:rgba(255,255,255,.8);font-family:var(--font-title)}

/* Qianling back */
.card-back.qianling{
  background:
    radial-gradient(circle at 25% 20%,rgba(255,255,255,.06) 0%,transparent 45%),
    radial-gradient(circle at 75% 70%,rgba(0,0,0,.2) 0%,transparent 50%),
    linear-gradient(145deg,#D47A68,#E8927C,#E8A090);
}
.card-back.qianling::before{
  content:'';position:absolute;inset:10px;border-radius:10px;opacity:.12;
  background-image:
    radial-gradient(circle at 30% 40%,rgba(255,255,255,.7) 1px,transparent 1px),
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.7) 1.5px,transparent 1.5px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.7) 1px,transparent 1px),
    radial-gradient(circle at 20% 80%,rgba(255,255,255,.5) .8px,transparent .8px),
    radial-gradient(circle at 80% 30%,rgba(255,255,255,.5) 1.2px,transparent 1.2px);
  background-size:40px 40px,60px 60px,35px 35px,50px 50px,45px 45px;
  background-position:0 0,15px 10px,25px 5px,10px 15px,5px 5px;
}

/* Lover back */
.card-back.lover{
  background:
    radial-gradient(ellipse at 35% 25%,rgba(255,255,255,.08) 0%,transparent 55%),
    radial-gradient(ellipse at 65% 75%,rgba(0,0,0,.15) 0%,transparent 55%),
    linear-gradient(155deg,#B0808E,#C4929E,#D4A8B0);
}
.card-back.lover::before{
  content:'';position:absolute;inset:10px;border-radius:10px;opacity:.1;
  background:repeating-linear-gradient(-35deg,transparent,transparent 10px,rgba(255,255,255,.4) 10px,rgba(255,255,255,.4) 11px),
             repeating-linear-gradient(35deg,transparent,transparent 10px,rgba(255,255,255,.2) 10px,rgba(255,255,255,.2) 11px);
}

/* Verse back */
.card-back.verse{
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.1) 0%,transparent 45%),
    radial-gradient(circle at 40% 80%,rgba(0,0,0,.12) 0%,transparent 50%),
    linear-gradient(170deg,#A68D58,#C4A86C,#D4B87A);
}
.card-back.verse::before{
  content:'';position:absolute;inset:10px;border-radius:10px;opacity:.08;
  background:
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(0deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:16px 16px;
}

/* Gold border */
.card-back::after{
  content:'';position:absolute;inset:5px;border-radius:11px;
  border:1px solid rgba(255,255,255,.08);pointer-events:none;z-index:2;
}

/* ---- CARD FRONT ---- */
.card-front{
  background:var(--card-front);transform:rotateY(180deg);
  box-shadow:var(--shadow-flipped);
  display:flex;align-items:center;padding:16px 18px;
  border-left:4px solid transparent;
}
.card-front.qianling{border-left-color:var(--accent-qianling)}
.card-front.lover{border-left-color:var(--accent-lover)}
.card-front.verse{border-left-color:var(--accent-verse)}
.front-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0}
.front-icon svg{width:28px;height:28px}
.card-front.qianling .front-icon{background:#FDF3EF}
.card-front.lover .front-icon{background:#FDF3F7}
.card-front.verse .front-icon{background:#FDF9EF}
.front-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.front-label{font-size:.65rem;color:var(--ink-light);letter-spacing:.08em;font-family:var(--font-title)}
.front-text{font-size:.92rem;line-height:1.65;font-family:var(--font-text);word-break:break-word;min-height:2.4em;display:flex;align-items:center}
.card-front.verse .front-text{letter-spacing:.02em}
.front-lock{position:absolute;top:10px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--ink-faint);transition:all .25s}
.front-lock.active{background:var(--accent-qianling);box-shadow:0 0 6px var(--accent-qianling)}

/* ====== Sparkles ====== */
.sparkle{position:fixed;pointer-events:none;z-index:90;animation:sparkleBurst .85s ease-out forwards}
@keyframes sparkleBurst{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0) rotate(var(--sr))}}

/* ====== Bottom ====== */
.actions{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 0 calc(10px + var(--safe-bottom));gap:8px}
.reset-btn{
  padding:11px 32px;border-radius:22px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);
  font-size:.85rem;cursor:pointer;font-family:var(--font-title);letter-spacing:.08em;
  transition:all .2s;backdrop-filter:blur(4px);
}
.reset-btn:hover{background:rgba(255,255,255,.08)}
.reset-btn:active{background:rgba(255,255,255,.15);color:#fff;transform:scale(.96)}
.reset-btn:disabled{opacity:.3;cursor:not-allowed}
.hint{font-size:.63rem;color:rgba(255,255,255,.2);font-family:var(--font-text);display:flex;align-items:center;gap:5px}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:calc(10px + var(--safe-bottom));right:10px;display:flex;gap:6px;z-index:20}
.nav-btn{
  width:33px;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.35);transition:all .2s;
}
.nav-btn:hover{background:rgba(255,255,255,.1)}
.nav-btn:active{background:rgba(255,255,255,.18);color:#fff;transform:scale(.9)}

/* ====== Panels ====== */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{background:var(--card-front);width:100%;max-width:420px;max-height:78vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:slideUp .3s ease;padding-bottom:var(--safe-bottom);color:var(--ink)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.panel-header h3{font-size:1rem;font-weight:400;font-family:var(--font-title);letter-spacing:.05em}
.panel-close{width:30px;height:30px;border:1px solid var(--hairline);background:transparent;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-light)}
.edit-tabs{display:flex;padding:0 16px;gap:4px;margin-bottom:8px}
.edit-tab{padding:7px 14px;border:1px solid var(--hairline);border-radius:16px;background:transparent;font-size:.8rem;cursor:pointer;color:var(--ink-light);font-family:var(--font-ui);transition:all .2s}
.edit-tab.active{background:var(--ink);color:var(--card-front);border-color:var(--ink)}
.edit-list{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.edit-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);font-size:.85rem;line-height:1.5;font-family:var(--font-text)}
.edit-item span{flex:1;word-break:break-word}
.edit-item-del{width:26px;height:26px;border:none;background:transparent;font-size:1rem;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);flex-shrink:0}
.edit-item-del:active{color:#c0392b}
.edit-add{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--hairline)}
.edit-add input{flex:1;padding:9px 14px;border:1px solid var(--hairline);border-radius:18px;font-size:.85rem;font-family:var(--font-text);background:#FBF7F2;color:var(--ink);outline:none}
.edit-add input:focus{border-color:var(--ink-light)}
.edit-add button{padding:9px 18px;border:none;border-radius:18px;background:var(--ink);color:#fff;font-size:.85rem;cursor:pointer;font-family:var(--font-ui);white-space:nowrap}
.history-list{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.history-group{margin-bottom:14px}
.history-date{font-size:.75rem;color:var(--ink-light);margin-bottom:6px;padding-left:4px}
.history-roll{background:#FBF7F2;border-radius:12px;padding:10px 14px;margin-bottom:6px;font-size:.8rem;line-height:1.55;font-family:var(--font-text)}
.history-roll .hi{display:flex;gap:6px;align-items:flex-start}
.history-roll .hi+.hi{margin-top:3px}
.hi-icon{flex-shrink:0;font-size:.8rem}
.empty-state{text-align:center;color:var(--ink-faint);padding:36px 20px;font-size:.85rem;font-family:var(--font-text)}
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#1A1410;padding:8px 20px;border-radius:16px;font-size:.8rem;z-index:200;pointer-events:none;font-family:var(--font-text);animation:toastIn .25s ease,toastOut .25s ease 1.5s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .card-inner{transition:none!important}
  .sparkle,.particle{animation:none!important;display:none}
  .panel{animation:none}
}
</style>
</head>
<body>

<!-- Floating particles canvas -->
<div id="particles"></div>

<div class="app">
  <header class="header">
    <h1>家庭灵感骰子</h1>
    <div class="date" id="dateDisplay"></div>
  </header>

  <div class="cards-area">
    <!-- Qianling -->
    <div class="card-item" id="cardItemQianling">
      <div class="card-inner" id="cardInnerQianling">
        <div class="card-face card-back qianling">
          <div class="card-back-inner">
            <div class="card-back-icon">
              <svg viewBox="0 0 54 54"><defs><radialGradient id="gq" cx="40%" cy="35%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M27 3 L32 18 L48 18 L34 28 L39 44 L27 35 L15 44 L20 28 L6 18 L22 18 Z" fill="url(#gq)"/></svg>
            </div>
            <span class="card-back-label">和谦灵玩</span>

        </div>
        <div class="card-face card-front qianling">
          <div class="front-icon">
            <svg viewBox="0 0 28 28"><path d="M14 2 L17 11 L27 11 L19 17 L22 26 L14 20 L6 26 L9 17 L1 11 L11 11 Z" fill="#E8927C" opacity=".8"/></svg>

            <div class="front-label">和谦灵玩</div>
            <div class="front-text" id="textQianling"></div>
          </div>
          <div class="front-lock" id="lockDotQianling"></div>
        </div>
      </div>
    </div>

    <!-- Lover -->
    <div class="card-item" id="cardItemLover">
      <div class="card-inner" id="cardInnerLover">
        <div class="card-face card-back lover">
          <div class="card-back-inner">
            <div class="card-back-icon">
              <svg viewBox="0 0 54 54"><defs><radialGradient id="gl" cx="40%" cy="35%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M27 48 C15 36 2 26 2 16 C2 7 9 0 18 0 C23 0 27 4 27 9 C27 4 31 0 36 0 C45 0 52 7 52 16 C52 26 39 36 27 48Z" fill="url(#gl)"/></svg>

          </div>
          <div class="front-body">

          </div>
          <div class="front-lock" id="lockDotLover"></div>

      </div>

    <!-- Verse -->
    <div class="card-item" id="cardItemVerse">
      <div class="card-inner" id="cardInnerVerse">
        <div class="card-face card-back verse">
          <div class="card-back-inner">
            <div class="card-back-icon">
              <svg viewBox="0 0 54 54"><defs><radialGradient id="gv" cx="50%" cy="30%"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity=".4"/></radialGradient></defs><path d="M27 48 C34 36 44 26 44 18 C44 8 36 3 27 3 C18 3 10 8 10 18 C10 26 20 36 27 48Z" fill="url(#gv)"/><circle cx="27" cy="19" r="8" fill="none" stroke="#fff" stroke-width="1.2" opacity=".5"/></svg>
            </div>
            <span class="card-back-label">今日经文</span>
          </div>
        </div>
        <div class="card-face card-front verse">
          <div class="front-icon">
            <svg viewBox="0 0 28 28"><path d="M14 25 C19 20 23 14 23 10 C23 5 19 2 14 2 C9 2 5 5 5 10 C5 14 9 20 14 25Z" fill="#C4A86C" opacity=".8"/><circle cx="14" cy="10" r="4" fill="none" stroke="#C4A86C" stroke-width="1" opacity=".6"/></svg>

  </div>

  <div class="actions">
    <button class="reset-btn" id="resetBtn">🔄　重新洗牌</button>
    <div class="hint">✦ 点击卡片翻开　·　摇晃手机也可触发</div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" id="editBtn" aria-label="编辑">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>

  </button>
</div>

<script>
// ==================================================================
//  Content pools — 105+ each
// ==================================================================
const DEFAULT_POOLS={qianling:[
'找家里三个蓝色的东西，用英文说出来 💙','玩 I spy：I spy something red! 在房间里找红色的东西','把彩色积木按颜色分组：red, blue, yellow, green','穿衣服时说颜色：Today we wear a yellow shirt!','画彩虹，边画边说：red, orange, yellow, green, blue, purple','拿出水果问：What color is the apple? Red!','找两种同色的东西，比赛谁找得快','走在路上玩：Point to something green! 🌿','把彩笔倒在桌上，让谦灵帮你拿特定颜色','洗澡时扔彩色玩具进水：The blue fish is swimming!',
'唱 Head, Shoulders, Knees and Toes，越唱越快 🎵','Simon says 谦灵版：touch your nose, clap your hands, wiggle your ears','指着身体问：Where is your belly button? Where are your elbows?','画一个大大的自画像，边画边说身体部位','洗澡时说：Wash your tummy, wash your toes 🛁','让谦灵当小老师指你的身体部位，你来用英文说','照镜子做表情：Show me your happy face! Show me your silly face!','跳舞时说动作：Shake your head, wiggle your fingers, stomp your feet',
'模仿动物声音让对方猜：Moo! 🐮 Oink! 🐷 Quack! 🦆','拿动物玩具排队，用英文点名：Here comes the elephant! 🐘','学动物走路：Hop like a bunny, crawl like a bear, swim like a fish','看动物绘本时间：每翻一页说出动物名字','玩动物分类：Which animals live on the farm? Which in the jungle?','自己编动物歌：Old MacDonald had a farm, E-I-E-I-O','画一个动物园，每画一只就说名字','睡前选一个动物说晚安：Good night, little cat 🐱',

// ==================== State ====================
const SK='ls-v4',HK='ls-hist-v4';
function ld(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){}return{pools:null,locked:{},todayRoll:null}}
function sd(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch(e){}}
function lh(){try{return JSON.parse(localStorage.getItem(HK))}catch(e){}return[]}
function sh(r){try{localStorage.setItem(HK,JSON.stringify(r))}catch(e){}}

let data=ld();
let pools=data.pools?{...DEFAULT_POOLS,...data.pools}:{...DEFAULT_POOLS};
let locked=data.locked||{qianling:false,lover:false,verse:false};
let history=lh();
let flipped={qianling:false,lover:false,verse:false};
let currentResults={qianling:'',lover:'',verse:''};
let animating=false;

const $date=document.getElementById('dateDisplay');
const $reset=document.getElementById('resetBtn');
const texts={qianling:document.getElementById('textQianling'),lover:document.getElementById('textLover'),verse:document.getElementById('textVerse')};
const inners={qianling:document.getElementById('cardInnerQianling'),lover:document.getElementById('cardInnerLover'),verse:document.getElementById('cardInnerVerse')};
const lockDots={qianling:document.getElementById('lockDotQianling'),lover:document.getElementById('lockDotLover'),verse:document.getElementById('lockDotVerse')};

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

(function(){const n=new Date();const ws=['周日','周一','周二','周三','周四','周五','周六'];$date.textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日　${ws[n.getDay()]}`})();

function updLocks(){lockDots.qianling.className='front-lock'+(locked.qianling?' active':'');lockDots.lover.className='front-lock'+(locked.lover?' active':'');lockDots.verse.className='front-lock'+(locked.verse?' active':'')}
updLocks();
for(const c of['qianling','lover','verse']){lockDots[c].addEventListener('click',e=>{e.stopPropagation();locked[c]=!locked[c];updLocks();data.locked=locked;sd(data)})}

// ==================== Text animation ====================
async function animText($el,finalText,pool,dur=650){
  const steps=10;let step=0;
  return new Promise(resolve=>{
    function next(){if(step>=steps){$el.textContent=finalText;resolve();return}let t;do{t=rand(pool)}while(t===$el.textContent&&pool.length>1);$el.textContent=t;step++;setTimeout(next,20+Math.pow(step/steps,3)*160)}
    next();
  });
}

// ==================== Flip ====================
async function flip(cat){
  if(animating||flipped[cat]||locked[cat])return;animating=true;
  currentResults[cat]=rand(pools[cat]);
  inners[cat].classList.add('flipped');await sleep(400);
  await animText(texts[cat],currentResults[cat],pools[cat]);
  flipped[cat]=true;clickSound();
  if(flipped.qianling&&flipped.lover&&flipped.verse){spawnSparkles();dingSound()}
  if(flipped.qianling&&flipped.lover&&flipped.verse){const t=todayKey();history.unshift({date:t,time:new Date().toISOString(),results:{...currentResults}});if(history.length>200)history.length=200;sh(history);data.todayRoll=t;sd(data)}
  animating=false;
}

// ==================== Reset ====================
async function resetAll(){
  if(animating||(!flipped.qianling&&!flipped.lover&&!flipped.verse))return;
  animating=true;$reset.disabled=true;
  for(const c of['qianling','lover','verse']){if(flipped[c]){inners[c].classList.add('flipping-back');inners[c].classList.remove('flipped')}}
  await sleep(500);
  for(const c of['qianling','lover','verse']){inners[c].classList.remove('flipping-back');flipped[c]=false;texts[c].textContent=''}
  animating=false;$reset.disabled=false;
}

// ==================== Sparkles ====================
function spawnSparkles(){
  const colors=['#E8927C','#C4929E','#C4A86C','#D4B87A','#fff','#FFD700','#F0C060'];
  for(let i=0;i<35;i++){setTimeout(()=>{const s=document.createElement('div');s.className='sparkle';s.style.cssText=`left:${15+Math.random()*70}%;top:${10+Math.random()*80}%;width:${2+Math.random()*7}px;height:${2+Math.random()*7}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};--sx:${(Math.random()-.5)*140}px;--sy:${(Math.random()-.5)*140-50}px;--sr:${(Math.random()-.5)*360}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),850)},i*12)}
}

// ==================== Sounds ====================
function clickSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.start(t);o.stop(t+.06)}catch(e){}}
function dingSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime;[0,.1].forEach((off,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=i===0?784:1047;g.gain.setValueAtTime(.08,t+off);g.gain.exponentialRampToValueAtTime(.001,t+off+.22);o.start(t+off);o.stop(t+off+.22)})}catch(e){}}

// ==================== Shake ====================
let shakeOk=false,lastShake=0;
function reqShake(){
  if(typeof DeviceMotionEvent!=='undefined'){if(typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(s=>{if(s==='granted')shakeOk=true}).catch(()=>{})}else shakeOk=true}
}
(function(){let lx,ly,lz;window.addEventListener('devicemotion',e=>{if(!shakeOk||animating)return;const {x,y,z}=e.accelerationIncludingGravity||{};if(lx===undefined){lx=x;ly=y;lz=z;return}if(Math.abs(x-lx)+Math.abs(y-ly)+Math.abs(z-lz)>15){const n=Date.now();if(n-lastShake>1500){lastShake=n;const u=Object.entries(flipped).filter(([k,v])=>!v&&!locked[k]).map(([k])=>k);if(u.length)flip(u[0])}}lx=x;ly=y;lz=z})})();

// ==================== Events ====================
document.getElementById('cardItemQianling').addEventListener('click',()=>flip('qianling'));
document.getElementById('cardItemLover').addEventListener('click',()=>flip('lover'));
document.getElementById('cardItemVerse').addEventListener('click',()=>flip('verse'));
$reset.addEventListener('click',resetAll);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!animating){e.preventDefault();if(flipped.qianling&&flipped.lover&&flipped.verse)resetAll();else{const u=Object.entries(flipped).filter(([k,v])=>!v&&!locked[k]).map(([k])=>k);if(u.length)flip(u[0])}}});

// ==================== Panels ====================
let panel=null,cat='qianling';
function openPanel(type){
  if(panel)return;const ov=document.createElement('div');ov.className='panel-overlay';
  const ie=type==='edit';
  ov.innerHTML=ie?`<div class="panel"><div class="panel-header"><h3>编辑内容</h3><button class="panel-close" id="pc">✕</button></div><div class="edit-tabs"><button class="edit-tab active" data-c="qianling">和谦灵玩</button><button class="edit-tab" data-c="lover">为爱人做</button><button class="edit-tab" data-c="verse">今日经文</button></div><div class="edit-list" id="el"></div><div class="edit-add"><input id="ei" placeholder="添加新内容..."><button id="ea">添加</button></div></div>`:`<div class="panel"><div class="panel-header"><h3>历史记录</h3><button class="panel-close" id="pc">✕</button></div><div class="history-list" id="hl"></div></div>`;
  document.body.appendChild(ov);panel={ov,type};
  if(ie){renderEdit();ov.querySelectorAll('.edit-tab').forEach(t=>t.addEventListener('click',()=>{cat=t.dataset.c;ov.querySelectorAll('.edit-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderEdit()}));ov.querySelector('#ea').addEventListener('click',()=>{const v=document.getElementById('ei').value.trim();if(v){pools[cat].push(v);savePools();renderEdit();document.getElementById('ei').value=''}document.getElementById('ei').focus()});ov.querySelector('#ei').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){pools[cat].push(v);savePools();renderEdit();e.target.value=''}}})}else{renderHistory()}
  ov.addEventListener('click',e=>{if(e.target===ov)closePanel()});ov.querySelector('#pc').addEventListener('click',closePanel);
}
function closePanel(){if(!panel)return;panel.ov.remove();panel=null}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderEdit(){const el=document.getElementById('el');if(!el)return;const items=pools[cat];el.innerHTML=items.length?items.map((s,i)=>`<div class="edit-item"><span>${esc(s)}</span><button class="edit-item-del" data-i="${i}">✕</button></div>`).join(''):'<div class="empty-state">还没有内容，在下方添加 ✨</div>';el.querySelectorAll('.edit-item-del').forEach(b=>b.addEventListener('click',()=>{pools[cat].splice(+b.dataset.i,1);savePools();renderEdit()}))}
function savePools(){data.pools={};for(const c of['qianling','lover','verse']){if(JSON.stringify(pools[c])!==JSON.stringify(DEFAULT_POOLS[c]))data.pools[c]=pools[c]}sd(data)}
function renderHistory(){const el=document.getElementById('hl');if(!el)return;if(!history.length){el.innerHTML='<div class="empty-state">还没有翻过牌 🎲</div>';return}const g={};history.forEach(h=>{if(!g[h.date])g[h.date]=[];g[h.date].push(h)});el.innerHTML=Object.entries(g).map(([d,rs])=>{const p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]),ws=['周日','周一','周二','周三','周四','周五','周六'];return`<div class="history-group"><div class="history-date">${+p[1]}月${+p[2]}日 ${ws[dt.getDay()]}</div>${rs.map(r=>`<div class="history-roll"><div class="hi"><span class="hi-icon">✦</span><span>${esc(r.results.qianling)}</span></div><div class="hi"><span class="hi-icon">❤</span><span>${esc(r.results.lover)}</span></div><div class="hi"><span class="hi-icon">✟</span><span>${esc(r.results.verse)}</span></div></div>`).join('')}</div>`}).join('')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
document.getElementById('editBtn').addEventListener('click',()=>openPanel('edit'));
document.getElementById('historyBtn').addEventListener('click',()=>openPanel('history'));

// ==================== Particles ====================
(function startParticles(){
  const container=document.getElementById('particles');
  const colors=['rgba(212,184,122,.5)','rgba(212,184,122,.3)','rgba(255,255,255,.25)','rgba(232,146,124,.35)','rgba(196,146,158,.3)'];
  function spawn(){const p=document.createElement('div');p.className='particle';const size=1.5+Math.random()*3;p.style.cssText=`left:${Math.random()*100}%;bottom:-10px;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${(Math.random()-.5)*60}px;--op:${.3+Math.random()*.5};animation-duration:${6+Math.random()*10}s;animation-delay:0s`;container.appendChild(p);setTimeout(()=>p.remove(),16000)}
  setInterval(spawn,900);
  for(let i=0;i<8;i++)setTimeout(spawn,i*400);
})();

// ==================== Install ====================
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.createElement('div');b.style.cssText='position:fixed;bottom:72px;left:14px;right:14px;background:rgba(30,24,20,.95);border-radius:14px;padding:12px 16px;box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;gap:10px;animation:slideUp .35s ease;color:#fff;font-family:var(--font-text);border:1px solid rgba(255,255,255,.1)';b.innerHTML=`<span style="flex:1;font-size:.78rem">📲 添加到主屏幕</span><button id="ibtn" style="padding:7px 16px;border:none;border-radius:14px;background:rgba(255,255,255,.15);color:#fff;font-size:.78rem;cursor:pointer;font-family:var(--font-ui)">添加</button><button id="iclose" style="background:transparent;border:none;color:rgba(255,255,255,.4);font-size:1rem;padding:4px 6px;cursor:pointer">✕</button>`;document.body.appendChild(b);document.getElementById('ibtn').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}b.remove()});document.getElementById('iclose').addEventListener('click',()=>b.remove())});

// ==================== Boot ====================
(function(){
  const today=todayKey();
  if(data.todayRoll!==today){currentResults.qianling=rand(pools.qianling);currentResults.lover=rand(pools.lover);currentResults.verse=rand(pools.verse)}else{const te=history.filter(h=>h.date===today);currentResults=te.length?{...te[0].results}:{qianling:rand(pools.qianling),lover:rand(pools.lover),verse:rand(pools.verse)}}
  reqShake();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
