      <stop offset="0%" stop-color="#2A2219"/>
      <stop offset="100%" stop-color="#1E1814"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B87A"/>
