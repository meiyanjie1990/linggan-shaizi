<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#EFE3C8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="rgba(92,69,38,0.14)" stroke-width="3"/>
  <!-- Three cards slightly fanned -->
  <g transform="translate(256,240)">
    <rect x="-130" y="-120" width="80" height="112" rx="10" fill="#C98B52" opacity="0.92" transform="rotate(-8)"/>
    <rect x="-40" y="-130" width="80" height="112" rx="10" fill="#C9738A" opacity="0.96"/>
    <rect x="50" y="-120" width="80" height="112" rx="10" fill="#7E9A78" opacity="0.92" transform="rotate(8)"/>
    <!-- inner white borders -->
    <rect x="-124" y="-114" width="68" height="100" rx="7" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" transform="rotate(-8)"/>
    <rect x="-34" y="-124" width="68" height="100" rx="7" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
    <rect x="56" y="-114" width="68" height="100" rx="7" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" transform="rotate(8)"/>
  </g>
</svg>
